# --ProtoAI-Bakari--
# Flight-deck profile: glm51-iq2xxs-tp2-ep8-c1-fp8kv
# Target: GLM-5.1 IQ2_XXS on ZCCX 16x RTX 3090 (8 nodes x 2 GPUs)
# Topology: TP=2 within node (NVLink), EP=8 across nodes (100 GbE RoCEv2)
# Source: cc8 STORY_BACKLOG #1, role CLAUDE.md launch spec
profile_name: glm51-iq2xxs-tp2-ep8-c1-fp8kv

model:
  hf_id: zai-org/GLM-5.1-IQ2_XXS
  arch: glm-5.1
  experts_total: 256
  experts_active: 8           # EP=8 is exact fit (one shard per node-pair)
  quant: iq2_xxs
  approx_weight_gib: 96       # IQ2_XXS GLM-5.1 estimate; final per-rank from EP shard

parallelism:
  tensor_parallel_size: 2     # NVLink within Mac Pro node
  expert_parallel_size: 8     # across 8 ZCCX nodes
  pipeline_parallel_size: 1
  data_parallel_size: 1
  total_ranks: 16

server:
  port: 8000
  host: 0.0.0.0
  served_model_name: glm51-iq2xxs

kv_cache:
  dtype: fp8                   # halves KV bandwidth, ~1% perplexity tax
  block_size: 16
  swap_space_gib: 0            # no CPU-offload at launch; revisit per-bench

memory:
  gpu_memory_utilization: 0.90
  max_model_len: 32768
  max_num_seqs: 256            # tune per conc-sweep result
  max_num_batched_tokens: 8192 # initial; sweep this knob

attention:
  prefix_cache: true
  enable_chunked_prefill: true

nodes:
  layout: zccx_8x2
  hosts: [cuda1, cuda2, cuda3, cuda4, cuda5, cuda6, cuda7, cuda8]
  per_node_gpus: 2
  cordon_unwanted: true        # kubectl cordon non-cuda* before launch
  gid_index_normalize: true    # RoCEv2 prereq

nccl:
  debug: INFO
  socket_ifname: bond0         # 100 GbE RoCEv2 bond
  ib_disable: 0
  ib_gid_index: 3              # normalized RoCEv2 GID
  p2p_disable: 0
  net_gdr_level: 5

env:
  VLLM_USE_DEEP_GEMM: "0"      # sm_86 cannot run Hopper DEEP_GEMM
  VLLM_ATTENTION_BACKEND: ""   # let vLLM select sm_86 backend
  CUDA_DEVICE_MAX_CONNECTIONS: "32"
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"

acceptance:
  conc1_target_tier: bronze    # 25 t/s realistic (corpus §8.2)
  agg_target_conc4_tier: bronze # 100 t/s; stretch silver 300 conc=8
  top1_agreement_vs_pp_baseline: 0.98
  cosine_min: 0.97
  perplexity_drift_max: 0.02

bench:
  conc_sweep: [1, 2, 4, 8, 16, 32]
  drain_between_conc: true
  capture_nccl_fabric: true
  capture_per_gpu_util: true
  capture_kv_metrics: true
  output_dir: /tmp/bench_glm51_tp2_ep8

artifact_out: /Users/z/AGENT/comms/PATH_A_FINAL_RESULTS_<datetime>.md
