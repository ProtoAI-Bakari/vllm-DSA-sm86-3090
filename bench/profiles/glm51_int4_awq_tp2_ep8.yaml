# --ProtoAI-Bakari--
# Flight-deck profile: glm51-int4-awq-marlin-tp2-ep8
# Target: GLM-5.1 quantized to INT4-AWQ via MARLIN sm_86 GEMM kernels.
# Pre-author for EPIC 3.1 GLM path — GLM-5.1 also has 256 experts × 8 active,
# so EP=8 is exact fit identical to DSV4 topology.
# IQ2_XXS variant already exists; this is the AWQ-INT4 alternative for tighter
# perplexity vs IQ2 (AWQ ≤2% drop vs ~1-3% IQ2 drop typical).
profile_name: glm51-int4-awq-marlin-tp2-ep8

model:
  hf_id: zai-org/GLM-5.1-AWQ-INT4   # populated by CC5 calibration output (after dsv4 path proven)
  arch: glm-5.1
  experts_total: 256
  experts_active: 8
  quant: int4_awq
  quant_method: marlin
  approx_weight_gib: 80              # GLM-5.1 ~320GB BF16 -> ~80 INT4 / 16 ranks = 5 GB/rank
  awq_calib:
    set: cc6_1500_prompt_fixed_seed
    blocks_per_expert: true

parallelism:
  tensor_parallel_size: 2
  expert_parallel_size: 8
  pipeline_parallel_size: 1
  data_parallel_size: 1
  total_ranks: 16

server:
  port: 8000
  host: 0.0.0.0
  served_model_name: glm51-int4-awq

kv_cache:
  dtype: fp8
  block_size: 16
  swap_space_gib: 0

memory:
  gpu_memory_utilization: 0.90
  max_model_len: 32768
  max_num_seqs: 256
  max_num_batched_tokens: 8192

attention:
  prefix_cache: true
  enable_chunked_prefill: true

nodes:
  layout: zccx_8x2
  hosts: [cuda1, cuda2, cuda3, cuda4, cuda5, cuda6, cuda7, cuda8]
  per_node_gpus: 2
  cordon_unwanted: true
  gid_index_normalize: true

nccl:
  debug: INFO
  socket_ifname: bond0
  ib_disable: 0
  ib_gid_index: 3
  p2p_disable: 0
  net_gdr_level: 5

env:
  VLLM_USE_DEEP_GEMM: "0"
  VLLM_MARLIN_SM86: "1"
  VLLM_ATTENTION_BACKEND: ""
  CUDA_DEVICE_MAX_CONNECTIONS: "32"
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"

acceptance:
  conc1_target_tier: silver           # 35-45 t/s realistic
  agg_target_conc4_tier: silver       # 250-400 t/s realistic
  top1_agreement_vs_iq2_xxs: 0.97     # AWQ should match or beat IQ2_XXS top-1
  cosine_min: 0.97
  perplexity_drift_max: 0.02

bench:
  conc_sweep: [1, 2, 4, 8, 16, 32]
  drain_between_conc: true
  capture_nccl_fabric: true
  capture_per_gpu_util: true
  capture_kv_metrics: true
  output_dir: /Users/z/AGENT/bench_glm51_int4_awq_tp2_ep8

artifact_out: /Users/z/AGENT/comms/PATH_A_FINAL_RESULTS_<datetime>.md

dependencies:
  blocked_on:
    - cc5_int4_awq_marlin_sm86_calibrated_weights
    - cc6_correctness_gate_pass_vs_iq2_xxs_baseline
    - cc7_cluster_fanout
