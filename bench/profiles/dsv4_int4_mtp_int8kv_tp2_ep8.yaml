# --ProtoAI-Bakari--
# Flight-deck profile: dsv4-int4-mtp-int8kv-tp2-ep8
# Target: DeepSeek-V4-Flash INT4-AWQ + MTP + INT8 KV cache (EPIC 3.2 final).
# INT8 KV halves KV bandwidth on top of FP8, 4x effective slot capacity vs FP16.
# 3090 supports INT8 KV natively; numerics tax ≤1% perplexity per corpus §EPIC 3.2.
profile_name: dsv4-int4-mtp-int8kv-tp2-ep8

model:
  hf_id: deepseek-ai/DeepSeek-V4-Flash-AWQ-INT4
  arch: deepseek-v4
  experts_total: 256
  experts_active: 8
  quant: int4_awq
  quant_method: marlin
  approx_weight_gib: 68
  speculative:
    method: mtp
    num_speculative_tokens: 4
    target_acceptance_rate: 0.7

parallelism:
  tensor_parallel_size: 2
  expert_parallel_size: 8
  pipeline_parallel_size: 1
  data_parallel_size: 1
  total_ranks: 16

server:
  port: 8000
  host: 0.0.0.0
  served_model_name: dsv4-int4-mtp-int8kv

kv_cache:
  dtype: int8                            # halves KV bandwidth vs fp8 (4x vs fp16)
  block_size: 16
  swap_space_gib: 0
  scaling_factor: dynamic                # per-block dynamic for accuracy

memory:
  gpu_memory_utilization: 0.90
  max_model_len: 65536                   # 2x larger ctx fits with int8 KV
  max_num_seqs: 512                      # 2x more concurrent slots
  max_num_batched_tokens: 8192

attention:
  prefix_cache: true
  enable_chunked_prefill: true
  sparse_attn_indexer: enabled
  mla_sparse: enabled

nodes:
  layout: zccx_8x2
  hosts: [cuda1, cuda2, cuda3, cuda4, cuda5, cuda6, cuda7, cuda8]
  per_node_gpus: 2
  cordon_unwanted: true
  gid_index_normalize: true

nccl:
  debug: INFO
  socket_ifname: bond0
  ib_disable: 0
  ib_gid_index: 3
  p2p_disable: 0
  net_gdr_level: 5

env:
  VLLM_USE_DEEP_GEMM: "0"
  VLLM_USE_TRITON_FLASH_ATTN: "1"
  VLLM_MARLIN_SM86: "1"
  VLLM_USE_SPEC_DECODE: "1"
  VLLM_SPEC_DECODE_NUM_LOOKAHEAD: "4"
  VLLM_KV_CACHE_DTYPE: "int8"
  VLLM_ATTENTION_BACKEND: ""
  CUDA_DEVICE_MAX_CONNECTIONS: "32"
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"

acceptance:
  conc1_target_tier: gold                 # 55-70 t/s realistic
  conc1_stretch_tier: platinum            # 65-85 t/s
  agg_target_conc4_tier: gold             # 400-600 t/s
  agg_stretch_tier: platinum              # 700+ at conc 8-16 with int8 KV slot multiplier
  perplexity_drift_max_vs_fp8_kv: 0.01    # tight gate — int8 must not regress >1%
  identical_tokens_temp0_mtp_on_vs_off: true

bench:
  conc_sweep: [1, 2, 4, 8, 16, 32, 64]    # extra step thanks to KV slot expansion
  drain_between_conc: true
  capture_nccl_fabric: true
  capture_per_gpu_util: true
  capture_kv_metrics: true
  capture_mtp_acceptance_rate: true
  output_dir: /Users/z/AGENT/bench_dsv4_int4_mtp_int8kv

artifact_out: /Users/z/AGENT/comms/PATH_A_FINAL_RESULTS_<datetime>.md

dependencies:
  blocked_on:
    - epic_3_2_int4_mtp_pass
    - cc6_correctness_gate_pass_int8_kv_<=1pct_drift
